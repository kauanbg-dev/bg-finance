<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f172a" />
  <script>
    (function () {
      var theme = localStorage.getItem("bg-theme");
      if (theme !== "light" && theme !== "dark") theme = "dark";
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#f3f6fb" : "#0f172a");
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BG Finance" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="referrer" content="no-referrer" />
  <title>Nova senha - BG Finance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <main class="auth-shell single">
    <section class="auth-panel">
      <div class="auth-card">
        <div id="step-form">
          <div class="auth-badge">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </div>
          <h1 class="auth-title">Criar nova senha</h1>
          <p class="auth-subtitle">Escolha uma senha que você não usa em outros sites.</p>

          <form id="reset-form" class="auth-form" novalidate>
            <div class="field">
              <label for="password">Nova senha</label>
              <div class="input-wrap">
                <svg class="input-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input id="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" data-strength="strength" required />
                <button type="button" class="eye-btn" data-toggle-password="password"></button>
              </div>
              <div class="strength" id="strength" data-score="0">
                <div class="strength-bars"><i></i><i></i><i></i><i></i></div>
                <span class="strength-label"></span>
              </div>
            </div>

            <div class="field">
              <label for="confirm">Confirmar nova senha</label>
              <div class="input-wrap">
                <svg class="input-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                <input id="confirm" type="password" placeholder="Repita a senha" autocomplete="new-password" required />
                <button type="button" class="eye-btn" data-toggle-password="confirm"></button>
              </div>
            </div>

            <p id="msg" class="msg" role="alert"></p>

            <button class="btn primary full" type="submit" id="submit-btn">Salvar nova senha</button>
          </form>
        </div>

        <div id="step-invalid" class="hidden">
          <div class="auth-badge danger">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
          </div>
          <h1 class="auth-title">Link inválido ou expirado</h1>
          <p class="auth-subtitle">Por segurança, cada link vale por 30 minutos e só pode ser usado uma vez. Peça um novo para continuar.</p>
          <a class="btn primary full btn-link" href="./forgot.html">Pedir novo link</a>
        </div>

        <p class="auth-switch"><a class="link" href="./login.html">Voltar para o login</a></p>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="reset.js"></script>
  <script src="theme.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
